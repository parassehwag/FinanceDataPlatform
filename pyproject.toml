[build-system]
requires = [
"setuptools>=69",
"wheel",
"build"
]
build-backend = "setuptools.build_meta"

[project]
name = "finance-data-platform"
version = "0.1.0"
description = "AI-native, production-grade finance data platform built with Python and PySpark."
readme = "README.md"
requires-python = ">=3.11,<3.12"

dependencies = [
"pyspark>=3.5,<4.0",
"PyYAML>=6.0,<7.0",
"pydantic>=2.0,<3.0",
"pydantic-settings>=2.0,<3.0"
]

[project.optional-dependencies]
dev = [    
"build>=1.2,<2.0",
"pytest>=8.0,<9.0",
"pytest-cov>=5.0,<7.0",
"ruff>=0.8,<1.0",
"mypy>=1.10,<2.0",
"pre-commit>=4.0,<5.0"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = [
"tests/unit",
"tests/integration",
"tests/contract"
]
pythonpath = [
"src"
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
